<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - Square Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background-color: #f4f5f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            border: none;
            border-radius: 0.5rem;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.08);
        }
        .brand-title {
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #212529;
        }
        .card-subtitle {
            color: #6c757d;
        }
        .btn-dark {
            padding: 0.6rem 1rem;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="login-card card p-4 p-md-5">
        <div class="card-body">

            <h1 class="brand-title h4 text-center mb-1">Square Games</h1>
            <p class="card-subtitle text-center mb-4">Connexion à votre compte</p>

            <form action="/login" method="post">

                <div class="mb-3">
                    <label for="username" class="form-label">Identifiant</label>
                    <input type="text" class="form-control" id="username" name="username" autocomplete="username">
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Mot de passe</label>
                    <input type="password" class="form-control" id="password" name="password" autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-dark w-100">Connexion</button>

            </form>

        </div>
    </div>
</div>

</body>

</html>
